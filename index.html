<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102019">
<title>PauperPilot · Mobile Meta</title>
<style>
:root{color-scheme:dark;--bg:#101713;--panel:#19231d;--line:#2b3930;--muted:#9bad9f;--text:#edf4ee;--accent:#b2e3a2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,sans-serif}header{padding:24px 18px 18px;background:#142019;border-bottom:1px solid var(--line)}main{max-width:780px;margin:auto;padding:20px 14px}h1{font-size:1.45rem;margin:0 0 3px}header p{margin:0;color:var(--muted);font-size:.92rem}.toolbar{display:flex;gap:10px;align-items:center;margin:0 0 14px}.toolbar button{min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--text);font:inherit;cursor:pointer}.toolbar select{flex:1;min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);padding:0 12px;font:inherit}.status{color:var(--muted);font-size:.9rem;margin:10px 2px}.table-wrap{overflow:hidden;border:1px solid var(--line);border-radius:14px;background:var(--panel)}table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--muted);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;padding:11px 13px;border-bottom:1px solid var(--line)}td{padding:0;border-bottom:1px solid var(--line)}tr:last-child td{border-bottom:0}.deck-link{display:grid;grid-template-columns:minmax(0,1fr) 6rem 6rem;gap:12px;align-items:center;padding:13px;color:inherit;text-decoration:none;min-height:52px}.deck-link:active,.deck-link:focus-visible{background:#26372c;outline:2px solid var(--accent);outline-offset:-2px}.name{font-weight:600}.share,.price{text-align:right}.share{color:var(--accent);font-variant-numeric:tabular-nums;white-space:nowrap}.price{color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}th:first-child{width:60%}th:nth-child(2),th:last-child{text-align:right}footer{color:var(--muted);font-size:.8rem;margin:18px 3px}a{color:inherit}@media(max-width:480px){.price,th:last-child{display:none}main{padding:16px 10px}.deck-link{padding:13px 12px;grid-template-columns:minmax(0,1fr) 5rem}}
</style></head>
<body><header><h1>PauperPilot · Mobile Meta</h1><p>Archetypes by popularity · tap a deck to open its PauperPilot page.</p></header><main><div class="toolbar"><select id="period" aria-label="Date range"><option value="30d">Last 30 days</option><option value="7d">Last 7 days</option><option value="90d">Last 90 days</option><option value="bnr">Since B&amp;R</option><option value="set">Since set</option></select><button id="refresh" type="button">Refresh</button></div><div id="status" class="status" role="status">Loading PauperPilot data…</div><div class="table-wrap"><table><thead><tr><th>Archetype</th><th>Meta share</th><th>Price</th></tr></thead><tbody id="rows"></tbody></table></div><footer>Data and archetype links from <a href="https://pauperpilot.com/">PauperPilot</a>. Loaded through <a href="https://allorigins.win/">AllOrigins</a>. Each row links directly to its matching archetype page.</footer></main>
<script src="app.js" defer></script></body></html>
